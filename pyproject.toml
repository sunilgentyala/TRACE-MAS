[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trace-mas"
version = "1.0.0"
description = "TRACE-MAS: Unified cryptographic framework for multi-agent LLM pipeline security"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sunil Gentyala", email = "sugentyala@ieee.org" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = [
    "multi-agent systems",
    "LLM security",
    "zero-knowledge proofs",
    "prompt injection",
    "alignment drift",
    "agentic AI"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.24"]
examples = ["langgraph>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://sunilgentyala.github.io/TRACE-MAS/"
Repository = "https://github.com/sunilgentyala/TRACE-MAS"
